<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ネイルサロン予約</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/liff.js"></script>
</head>
<body class="bg-pink-50 text-gray-800 font-sans">

  <div id="app" class="max-w-md mx-auto min-h-screen bg-white shadow-lg flex flex-col">
    <!-- ヘッダー -->
    <header class="bg-pink-500 text-white p-4 text-center font-bold text-lg">
      Nail Salon 予約
    </header>

    <!-- メインコンテンツ領域 -->
    <main class="p-4 flex-1">
      
      <!-- STEP 1: メニュー選択 -->
      <div id="step-menu" class="space-y-4">
        <h2 class="text-md font-bold text-pink-600 border-b pb-2">1. ご希望のメニューを選択</h2>
        <div class="space-y-2">
          <label class="block border p-3 rounded-lg cursor-pointer hover:bg-pink-50 flex justify-between items-center">
            <span>ワンカラー (60分)</span>
            <span class="font-bold text-pink-500">¥5,500</span>
            <input type="radio" name="menu" value="ワンカラー" class="accent-pink-500">
          </label>
          <label class="block border p-3 rounded-lg cursor-pointer hover:bg-pink-50 flex justify-between items-center">
            <span>グラデーション (60分)</span>
            <span class="font-bold text-pink-500">¥6,500</span>
            <input type="radio" name="menu" value="グラデーション" class="accent-pink-500">
          </label>
          <label class="block border p-3 rounded-lg cursor-pointer hover:bg-pink-50 flex justify-between items-center">
            <span>フレンチネイル (90分)</span>
            <span class="font-bold text-pink-500">¥7,000</span>
            <input type="radio" name="menu" value="フレンチネイル" class="accent-pink-500">
          </label>
          <label class="block border p-3 rounded-lg cursor-pointer hover:bg-pink-50 flex justify-between items-center">
            <span>やり放題・持ち込み (120分)</span>
            <span class="font-bold text-pink-500">¥9,500</span>
            <input type="radio" name="menu" value="やり放題（持ち込みOK）" class="accent-pink-500">
          </label>
        </div>
        <button onclick="goToDateSelect()" class="w-full bg-pink-500 text-white py-3 rounded-lg font-bold mt-6 shadow hover:bg-pink-600 transition">次へ進む</button>
      </div>

      <!-- STEP 2: 日時選択 -->
      <div id="step-date" class="hidden space-y-4">
        <h2 class="text-md font-bold text-pink-600 border-b pb-2">2. ご希望の日時を選択</h2>
        <div>
          <label class="block text-sm text-gray-600 mb-1">日付</label>
          <input type="date" id="reservation-date" class="w-full border p-2 rounded-lg focus:outline-none focus:border-pink-500" onchange="fetchAvailableSlots()">
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1 mt-4">空き時間</label>
          <div id="slots-container" class="grid grid-cols-2 gap-2 mt-2">
            <p class="text-sm text-gray-400 col-span-2">日付を選択してください</p>
          </div>
        </div>
        
        <div class="flex gap-2 mt-6">
          <button onclick="backToMenu()" class="w-1/3 bg-gray-200 text-gray-700 py-3 rounded-lg font-bold shadow hover:bg-gray-300 transition">戻る</button>
          <button onclick="goToCustomerInfo()" class="w-2/3 bg-pink-500 text-white py-3 rounded-lg font-bold shadow hover:bg-pink-600 transition">お客様情報の入力へ</button>
        </div>
      </div>

      <!-- STEP 3: お客様情報入力 -->
      <div id="step-info" class="hidden space-y-4">
        <h2 class="text-md font-bold text-pink-600 border-b pb-2">3. お客様情報の入力</h2>
        
        <!-- 選択内容の確認カード -->
        <div class="bg-pink-50 p-3 rounded-lg border border-pink-200 text-sm space-y-1">
          <p><span class="text-gray-500">メニュー：</span><span id="summary-menu" class="font-bold"></span></p>
          <p><span class="text-gray-500">日時：</span><span id="summary-datetime" class="font-bold"></span></p>
        </div>

        <div>
          <label class="block text-sm text-gray-600 mb-1">お名前 <span class="text-red-500">*</span></label>
          <input type="text" id="customer-name" placeholder="フルネーム" class="w-full border p-2 rounded-lg focus:outline-none focus:border-pink-500">
        </div>

        <div>
          <label class="block text-sm text-gray-600 mb-1">電話番号 <span class="text-red-500">*</span></label>
          <input type="tel" id="customer-phone" placeholder="09012345678" class="w-full border p-2 rounded-lg focus:outline-none focus:border-pink-500">
        </div>

        <div class="flex gap-2 mt-6">
          <button onclick="backToDate()" class="w-1/3 bg-gray-200 text-gray-700 py-3 rounded-lg font-bold shadow hover:bg-gray-300 transition">戻る</button>
          <button id="submit-btn" onclick="submitReservation()" class="w-2/3 bg-pink-500 text-white py-3 rounded-lg font-bold shadow hover:bg-pink-600 transition">予約を確定する</button>
        </div>
      </div>

    </main>
  </div>

  <script>
    // ★ご自身のGAS URL
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwgs-jro28yxAkZ5K-y5Ffd1j9eRNhvK0Csml8RpT1IVQs-KFE0fUhMyXz3bk1R_Gwa/exec"; 
    // ★ご自身のLIFF ID
    const LIFF_ID = "2010867723-I6hdQFSV"; 

    let selectedMenu = "";
    let selectedDate = "";
    let selectedTime = "";
    let userProfile = null;

    // --- LIFFの初期化 ---
    document.addEventListener("DOMContentLoaded", () => {
      liff.init({ liffId: LIFF_ID })
        .then(() => {
          if (liff.isLoggedIn()) {
            liff.getProfile().then(profile => {
              userProfile = profile;
              // LINEの名前が取れたら名前の入力欄に初期表示しておく
              const nameInput = document.getElementById('customer-name');
              if (nameInput && profile.displayName) {
                nameInput.value = profile.displayName;
              }
            });
          }
        })
        .catch(err => {
          console.error("LIFF初期化エラー:", err);
        });
    });

    // --- 画面遷移コントロール ---
    function goToDateSelect() {
      const checkedMenu = document.querySelector('input[name="menu"]:checked');
      if (!checkedMenu) {
        alert("メニューを選択してください。");
        return;
      }
      selectedMenu = checkedMenu.value;
      
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('reservation-date').setAttribute('min', today);

      document.getElementById('step-menu').classList.add('hidden');
      document.getElementById('step-date').classList.remove('hidden');
    }

    function backToMenu() {
      document.getElementById('step-date').classList.add('hidden');
      document.getElementById('step-menu').classList.remove('hidden');
      selectedTime = "";
      document.getElementById('slots-container').innerHTML = '<p class="text-sm text-gray-400 col-span-2">日付を選択してください</p>';
      document.getElementById('reservation-date').value = "";
    }

    function goToCustomerInfo() {
      if (!selectedDate || !selectedTime) {
        alert("日付と時間を選択してください。");
        return;
      }
      // サマリー（確認）の書き換え
      document.getElementById('summary-menu').innerText = selectedMenu;
      document.getElementById('summary-datetime').innerText = `${selectedDate} ${selectedTime}`;

      document.getElementById('step-date').classList.add('hidden');
      document.getElementById('step-info').classList.remove('hidden');
    }

    function backToDate() {
      document.getElementById('step-info').classList.add('hidden');
      document.getElementById('step-date').classList.remove('hidden');
    }

    // --- GASから空き時間を取得 (GET) ---
    async function fetchAvailableSlots() {
      selectedDate = document.getElementById('reservation-date').value;
      selectedTime = "";
      if (!selectedDate) return;

      const container = document.getElementById('slots-container');
      container.innerHTML = '<p class="text-sm text-gray-500 col-span-2 flex items-center justify-center py-4">空き時間を読み込み中...</p>';

      try {
        const response = await fetch(`${GAS_URL}?date=${selectedDate}&menu=${encodeURIComponent(selectedMenu)}`);
        const data = await response.json();

        container.innerHTML = '';
        if (data.slots && data.slots.length > 0) {
          data.slots.forEach(time => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'border border-pink-300 p-2 rounded-lg text-center hover:bg-pink-500 hover:text-white transition text-gray-800';
            btn.innerText = time;
            btn.onclick = () => {
              document.querySelectorAll('#slots-container button').forEach(b => {
                b.classList.remove('bg-pink-500', 'text-white');
                b.classList.add('text-gray-800');
              });
              btn.classList.add('bg-pink-500', 'text-white');
              btn.classList.remove('text-gray-800');
              selectedTime = time;
            };
            container.appendChild(btn);
          });
        } else {
          container.innerHTML = '<p class="text-sm text-red-500 col-span-2 text-center py-4">この日の空き時間はありません。</p>';
        }
      } catch (e) {
        console.error(e);
        container.innerHTML = '<p class="text-sm text-red-500 col-span-2 text-center py-4">空き時間の取得に失敗しました。</p>';
      }
    }

    // --- 予約送信処理 (POST) ---
    async function submitReservation() {
      const name = document.getElementById('customer-name').value.trim();
      const phone = document.getElementById('customer-phone').value.trim();

      if (!name) {
        alert("お名前を入力してください。");
        return;
      }
      if (!phone) {
        alert("電話番号を入力してください。");
        return;
      }

      const isOk = confirm(`【ご予約確定の確認】\n\nメニュー: ${selectedMenu}\n日時: ${selectedDate} ${selectedTime}\nお名前: ${name} 様\n電話番号: ${phone}\n\nこの内容で予約を確定しますか？`);
      if (!isOk) return;

      const submitBtn = document.getElementById('submit-btn');
      submitBtn.innerText = "送信中...";
      submitBtn.disabled = true;

      // LINEユーザーIDの取得（取れていなければ Unknown ）
      const lineUserId = userProfile ? userProfile.userId : "Unknown_User";

      const postData = {
        action: "reserve",
        date: selectedDate,
        time: selectedTime,
        menu: selectedMenu,
        name: name,
        phone: phone,
        lineUserId: lineUserId
      };

      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify(postData)
        });
        
        const result = await response.json();
        
        if (result.status === "success") {
          alert("ご予約が完了しました！\nご来店をお待ちしております。");
          if (typeof liff !== 'undefined' && liff.isInClient()) {
            liff.closeWindow();
          }
        } else {
          alert("エラー: " + result.message);
          submitBtn.innerText = "予約を確定する";
          submitBtn.disabled = false;
        }
      } catch (e) {
        console.error(e);
        alert("通信エラーが発生しました。");
        submitBtn.innerText = "予約を確定する";
        submitBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
