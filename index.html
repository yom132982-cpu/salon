<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ネイルサロン予約</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/liff.js"></script>
</head>
<body class="bg-pink-50 text-gray-800 font-sans">

  <div id="app" class="max-w-md mx-auto min-h-screen bg-white shadow-lg flex flex-col">
    <!-- ヘッダー -->
    <header class="bg-pink-500 text-white p-4 text-center font-bold text-lg">
      Nail Salon 予約
    </header>

    <!-- メインコンテンツ領域 -->
    <main class="p-4 flex-1">
      
      <!-- ステップ1: メニュー選択 -->
      <div id="step-menu" class="space-y-4">
        <h2 class="text-md font-bold text-pink-600 border-b pb-2">ご希望のメニューを選択してください</h2>
        <div class="space-y-2">
          <label class="block border p-3 rounded-lg cursor-pointer hover:bg-pink-50 flex justify-between items-center">
            <span>ワンカラー (60分)</span>
            <span class="font-bold text-pink-500">¥5,500</span>
            <input type="radio" name="menu" value="ワンカラー" class="accent-pink-500">
          </label>
          <label class="block border p-3 rounded-lg cursor-pointer hover:bg-pink-50 flex justify-between items-center">
            <span>グラデーション (60分)</span>
            <span class="font-bold text-pink-500">¥6,500</span>
            <input type="radio" name="menu" value="グラデーション" class="accent-pink-500">
          </label>
          <label class="block border p-3 rounded-lg cursor-pointer hover:bg-pink-50 flex justify-between items-center">
            <span>フレンチネイル (90分)</span>
            <span class="font-bold text-pink-500">¥7,000</span>
            <input type="radio" name="menu" value="フレンチネイル" class="accent-pink-500">
          </label>
          <label class="block border p-3 rounded-lg cursor-pointer hover:bg-pink-50 flex justify-between items-center">
            <span>やり放題・持ち込み (120分)</span>
            <span class="font-bold text-pink-500">¥9,500</span>
            <input type="radio" name="menu" value="やり放題（持ち込みOK）" class="accent-pink-500">
          </label>
        </div>
        <button onclick="goToDateSelect()" class="w-full bg-pink-500 text-white py-3 rounded-lg font-bold mt-6 shadow hover:bg-pink-600 transition">次へ進む</button>
      </div>

      <!-- ステップ2: 日時選択（初期状態では非表示） -->
      <div id="step-date" class="hidden space-y-4">
        <h2 class="text-md font-bold text-pink-600 border-b pb-2">ご希望の日時を選択してください</h2>
        <div>
          <label class="block text-sm text-gray-600 mb-1">日付</label>
          <input type="date" id="reservation-date" class="w-full border p-2 rounded-lg focus:outline-none focus:border-pink-500" onchange="fetchAvailableSlots()">
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1 mt-4">空き時間</label>
          <div id="slots-container" class="grid grid-cols-2 gap-2 mt-2">
            <!-- GASから取得した空き時間がここにボタンとして挿入されます -->
            <p class="text-sm text-gray-400 col-span-2">日付を選択してください</p>
          </div>
        </div>
        
        <div class="flex gap-2 mt-6">
          <button onclick="backToMenu()" class="w-1/3 bg-gray-200 text-gray-700 py-3 rounded-lg font-bold shadow hover:bg-gray-300 transition">戻る</button>
          <button onclick="goToConfirm()" class="w-2/3 bg-pink-500 text-white py-3 rounded-lg font-bold shadow hover:bg-pink-600 transition">予約を確定する</button>
        </div>
      </div>

    </main>
  </div>

  <script>
    // ★GASのURL（アクセス権限「全員」でデプロイしたもの）
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwvkWdtmFcEG5u365fYT8FNJlzuJYx8QlHsk6FaSLOQKoPYZbfG7qchyXRjVtk_Sxlc/exec"; 
    // ★LINE Developersで取得したLIFF IDをここに入れる
    const LIFF_ID = "2010867723-I6hdQFSV"; 

    let selectedMenu = "";
    let selectedDate = "";
    let selectedTime = "";
    let userProfile = null;

    // --- LIFFの初期化 ---
    document.addEventListener("DOMContentLoaded", () => {
      liff.init({ liffId: LIFF_ID })
        .then(() => {
          if (!liff.isLoggedIn()) {
            liff.login(); // LINE外のブラウザ等で開いた場合はログインを促す
          } else {
            liff.getProfile().then(profile => {
              userProfile = profile;
            });
          }
        })
        .catch(err => {
          console.error("LIFF初期化エラー:", err);
        });
    });

    // --- 画面遷移コントロール ---
    function goToDateSelect() {
      const checkedMenu = document.querySelector('input[name="menu"]:checked');
      if (!checkedMenu) {
        alert("メニューを選択してください。");
        return;
      }
      selectedMenu = checkedMenu.value;
      
      // 今日の日付をカレンダーの最小値に設定（過去の日付を選べないようにする）
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('reservation-date').setAttribute('min', today);

      document.getElementById('step-menu').classList.add('hidden');
      document.getElementById('step-date').classList.remove('hidden');
    }

    function backToMenu() {
      document.getElementById('step-date').classList.add('hidden');
      document.getElementById('step-menu').classList.remove('hidden');
      // 選択状態をリセット
      selectedTime = "";
      document.getElementById('slots-container').innerHTML = '<p class="text-sm text-gray-400 col-span-2">日付を選択してください</p>';
      document.getElementById('reservation-date').value = "";
    }

    // --- GASから空き時間を取得 (GET) ---
    async function fetchAvailableSlots() {
      selectedDate = document.getElementById('reservation-date').value;
      selectedTime = ""; // 日付が変わったら時間をリセット
      if (!selectedDate) return;

      const container = document.getElementById('slots-container');
      container.innerHTML = '<p class="text-sm text-gray-500 col-span-2 flex items-center justify-center py-4">空き時間を読み込み中...</p>';

      try {
        const response = await fetch(`${GAS_URL}?date=${selectedDate}&menu=${encodeURIComponent(selectedMenu)}`);
        const data = await response.json();

        container.innerHTML = '';
        if (data.slots && data.slots.length > 0) {
          data.slots.forEach(time => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'border border-pink-300 p-2 rounded-lg text-center hover:bg-pink-500 hover:text-white transition';
            btn.innerText = time;
            btn.onclick = () => {
              // 他のボタンの選択状態を解除
              document.querySelectorAll('#slots-container button').forEach(b => {
                b.classList.remove('bg-pink-500', 'text-white');
                b.classList.add('text-gray-800');
              });
              // クリックしたボタンを選択状態にする
              btn.classList.add('bg-pink-500', 'text-white');
              btn.classList.remove('text-gray-800');
              selectedTime = time;
            };
            container.appendChild(btn);
          });
        } else {
          container.innerHTML = '<p class="text-sm text-red-500 col-span-2 text-center py-4">この日の空き時間はありません。</p>';
        }
      } catch (e) {
        console.error(e);
        container.innerHTML = '<p class="text-sm text-red-500 col-span-2 text-center py-4">空き時間の取得に失敗しました。<br>時間をおいてお試しください。</p>';
      }
    }

    // --- 予約処理をGASへ送信 (POST) ---
    async function goToConfirm() {
      if (!selectedDate || !selectedTime) {
        alert("日付と時間を選択してください。");
        return;
      }
      
      // LIFFの読み込みが間に合わなかった・失敗した場合のフォールバック
      const displayName = userProfile ? userProfile.displayName : "LINEユーザー";
      const userId = userProfile ? userProfile.userId : "UnknownId";

      const isOk = confirm(`【ご予約内容】\nメニュー: ${selectedMenu}\n日時: ${selectedDate} ${selectedTime}\n\nこの内容で予約を確定しますか？`);
      if (!isOk) return;

      // 送信するデータ
      const postData = {
        action: "reserve",
        date: selectedDate,
        time: selectedTime,
        menu: selectedMenu,
        name: displayName,
        lineUserId: userId,
        phone: "未入力" 
      };

      try {
        // ボタンを連打できないようにテキストを変更
        const btn = event.target;
        const originalText = btn.innerText;
        btn.innerText = "送信中...";
        btn.disabled = true;

        // ⚠️ CORSエラーを回避するため、Content-Typeはあえて 'text/plain' にする
        const response = await fetch(GAS_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain',
          },
          body: JSON.stringify(postData)
        });
        
        const result = await response.json();
        
        if (result.status === "success") {
          alert("ご予約が完了しました！\nご来店をお待ちしております。");
          if (liff.isInClient()) {
            liff.closeWindow(); // LINEアプリ内ならウィンドウを閉じる
          }
        } else {
          alert("エラー: " + result.message);
          btn.innerText = originalText;
          btn.disabled = false;
        }
      } catch (e) {
        console.error(e);
        alert("通信エラーが発生しました。");
        event.target.innerText = "予約を確定する";
        event.target.disabled = false;
      }
    }
  </script>
</body>
</html>
